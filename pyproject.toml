[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "lobbying-research"
version = "0.1.0"
description = "Numerics and scripts for lobbying / network game model"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lobbying_research"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
exclude = [".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
default-groups = ["dev"]
